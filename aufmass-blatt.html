<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aufmaßblatt – Zimmertüren</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: Arial, Helvetica, sans-serif;
    color: #000;
    margin: 24px;
    background: #fff;
  }
  h1 {
    font-size: 20px;
    margin: 0 0 16px 0;
    text-align: center;
  }
  .kopf {
    border: 2px solid #000;
    padding: 16px 20px;
    margin-bottom: 24px;
  }
  .kopf-zeile {
    display: flex;
    align-items: flex-end;
    margin-bottom: 14px;
  }
  .kopf-zeile:last-child { margin-bottom: 0; }
  .kopf-zeile label {
    font-weight: bold;
    font-size: 14px;
    min-width: 170px;
  }
  .linie {
    flex: 1;
    border-bottom: 1px solid #000;
    min-height: 22px;
  }
  .tuer-block {
    border: 2px solid #000;
    padding: 16px 20px;
    margin-bottom: 24px;
    page-break-inside: avoid;
  }
  .tuer-block h2 {
    font-size: 15px;
    margin: 0 0 12px 0;
    border-bottom: 1px solid #000;
    padding-bottom: 6px;
  }
  .feld {
    display: flex;
    align-items: baseline;
    flex-wrap: wrap;
    margin-bottom: 10px;
    font-size: 14px;
  }
  .feld > .beschriftung {
    font-weight: bold;
    min-width: 130px;
  }
  .option {
    display: inline-flex;
    align-items: center;
    margin-right: 22px;
    margin-bottom: 4px;
    white-space: nowrap;
  }
  .option input[type="checkbox"] {
    width: 16px;
    height: 16px;
    margin-right: 6px;
    accent-color: #000;
  }
  .kurzlinie {
    display: inline-block;
    border-bottom: 1px solid #000;
    min-width: 160px;
    min-height: 18px;
    margin-left: 6px;
  }
  .langlinie {
    flex: 1;
    border-bottom: 1px solid #000;
    min-height: 20px;
    margin-left: 6px;
  }
  textarea.hinweise {
    width: 100%;
    min-height: 70px;
    border: 1px solid #000;
    margin-top: 4px;
    font-family: inherit;
    font-size: 14px;
    resize: vertical;
  }
  .btn-hinzufuegen {
    display: block;
    margin: 0 auto 24px auto;
    padding: 10px 28px;
    font-size: 15px;
    font-weight: bold;
    border: 2px solid #000;
    background: #fff;
    cursor: pointer;
  }
  .btn-hinzufuegen:hover { background: #eee; }
  .btn-entfernen {
    float: right;
    border: 1px solid #000;
    background: #fff;
    font-size: 12px;
    padding: 3px 10px;
    cursor: pointer;
  }
  @media print {
    body { margin: 0; }
    .btn-hinzufuegen, .btn-entfernen { display: none; }
    .tuer-block { border-width: 1.5px; }
  }
</style>
</head>
<body>

<h1>Aufmaßblatt – Zimmertüren</h1>

<div class="kopf">
  <div class="kopf-zeile">
    <label>Kommission:</label>
    <span class="linie"></span>
  </div>
  <div class="kopf-zeile">
    <label>Tür Modell:</label>
    <span class="linie"></span>
  </div>
  <div class="kopf-zeile">
    <label>Drücker Garnitur:</label>
    <span class="linie"></span>
  </div>
</div>

<div id="tueren"></div>

<button type="button" class="btn-hinzufuegen" id="btnHinzufuegen">☑ Tür hinzufügen</button>

<template id="vorlage-tuer">
  <div class="tuer-block">
    <button type="button" class="btn-entfernen">Entfernen</button>
    <h2 class="tuer-titel">Tür</h2>

    <div class="feld">
      <span class="beschriftung">Position:</span>
      <span class="langlinie"></span>
    </div>

    <div class="feld">
      <span class="beschriftung">Anschlag:</span>
      <span class="option"><input type="checkbox" name="anschlag"> DIN L</span>
      <span class="option"><input type="checkbox" name="anschlag"> DIN R</span>
    </div>

    <div class="feld">
      <span class="beschriftung">Tür Breite:</span>
      <span class="option"><input type="checkbox"> 610</span>
      <span class="option"><input type="checkbox"> 735</span>
      <span class="option"><input type="checkbox"> 860</span>
      <span class="option"><input type="checkbox"> 985</span>
    </div>
    <div class="feld">
      <span class="beschriftung">Sondermaß:</span>
      <span class="langlinie"></span>
    </div>

    <div class="feld">
      <span class="beschriftung">Tür Höhe:</span>
      <span class="option"><input type="checkbox"> 1985</span>
      <span class="option"><input type="checkbox"> 2110</span>
    </div>

    <div class="feld">
      <span class="beschriftung">Windstärke:</span>
      <span class="option"><input type="checkbox"> 80</span>
      <span class="option"><input type="checkbox"> 100</span>
      <span class="option"><input type="checkbox"> 125</span>
      <span class="option"><input type="checkbox"> 145</span>
      <span class="option"><input type="checkbox"> 165</span>
      <span class="option"><input type="checkbox"> 185</span>
      <span class="option"><input type="checkbox"> 205</span>
      <span class="option"><input type="checkbox"> 240</span>
    </div>
    <div class="feld">
      <span class="beschriftung">Sondermaß:</span>
      <span class="langlinie"></span>
    </div>

    <div class="feld" style="display:block;">
      <span class="beschriftung">Montage-/Bestellhinweise:</span>
      <textarea class="hinweise"></textarea>
    </div>
  </div>
</template>

<script>
  var container = document.getElementById('tueren');
  var vorlage = document.getElementById('vorlage-tuer');
  var btn = document.getElementById('btnHinzufuegen');
  var zaehler = 0;

  function tuerHinzufuegen() {
    zaehler++;
    var klon = vorlage.content.cloneNode(true);
    var block = klon.querySelector('.tuer-block');
    block.querySelector('.tuer-titel').textContent = 'Tür ' + zaehler;
    block.querySelectorAll('input[type="checkbox"]').forEach(function (cb) {
      cb.name = 'tuer' + zaehler + '-' + cb.closest('.feld').querySelector('.beschriftung').textContent.trim();
    });
    block.querySelector('.btn-entfernen').addEventListener('click', function () {
      block.remove();
      nummerieren();
    });
    container.appendChild(klon);
  }

  function nummerieren() {
    container.querySelectorAll('.tuer-block').forEach(function (block, i) {
      block.querySelector('.tuer-titel').textContent = 'Tür ' + (i + 1);
    });
    zaehler = container.querySelectorAll('.tuer-block').length;
  }

  btn.addEventListener('click', tuerHinzufuegen);
  tuerHinzufuegen();
</script>

</body>
</html>
