<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mistral Chat</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f1115;
      color: #e6e6e6;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 12px 20px;
      border-bottom: 1px solid #2a2d35;
      font-weight: 600;
    }
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .msg {
      max-width: 75%;
      padding: 10px 14px;
      border-radius: 12px;
      white-space: pre-wrap;
      line-height: 1.5;
    }
    .msg.user {
      align-self: flex-end;
      background: #2f6fed;
      color: #fff;
    }
    .msg.assistant {
      align-self: flex-start;
      background: #1d2027;
      border: 1px solid #2a2d35;
    }
    .msg.error {
      align-self: flex-start;
      background: #4a1d1d;
      border: 1px solid #7a2e2e;
    }
    form {
      display: flex;
      gap: 8px;
      padding: 12px 20px;
      border-top: 1px solid #2a2d35;
    }
    input {
      flex: 1;
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid #2a2d35;
      background: #1d2027;
      color: #e6e6e6;
      font-size: 15px;
    }
    input:focus { outline: 2px solid #2f6fed; }
    button {
      padding: 10px 18px;
      border: none;
      border-radius: 8px;
      background: #2f6fed;
      color: #fff;
      font-size: 15px;
      cursor: pointer;
    }
    button:disabled { opacity: 0.5; cursor: default; }
  </style>
</head>
<body>
  <header>Mistral Chat (mistral-small-latest)</header>
  <div id="messages"></div>
  <form id="chat-form">
    <input id="input" type="text" placeholder="Nachricht eingeben ..." autocomplete="off" autofocus />
    <button id="send" type="submit">Senden</button>
  </form>
  <script>
    const messagesEl = document.getElementById("messages");
    const form = document.getElementById("chat-form");
    const input = document.getElementById("input");
    const sendBtn = document.getElementById("send");
    const history = [];

    function addMessage(role, text) {
      const div = document.createElement("div");
      div.className = "msg " + role;
      div.textContent = text;
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
      return div;
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;
      input.value = "";
      sendBtn.disabled = true;
      addMessage("user", text);
      const typing = addMessage("assistant", "...");
      try {
        const res = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ messages: [...history, { role: "user", content: text }] }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "Unbekannter Fehler");
        typing.remove();
        addMessage("assistant", data.reply);
        history.push({ role: "user", content: text }, { role: "assistant", content: data.reply });
      } catch (err) {
        typing.className = "msg error";
        typing.textContent = "Fehler: " + err.message;
      } finally {
        sendBtn.disabled = false;
        input.focus();
      }
    });
  </script>
</body>
</html>
